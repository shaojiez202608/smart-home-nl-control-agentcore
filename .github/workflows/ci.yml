# Checks only: nothing here changes files or touches AWS. Action versions are pinned by commit SHA
# (looked up with `git ls-remote https://github.com/<owner>/<repo> refs/tags/<tag>`).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit tests, evaluation (mock + negative control)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: false
      - run: make init
      - run: make lint
      - run: make test
      - run: make eval

  synth:
    name: cdk synth + cdk-nag (no AWS credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: make init
      # Both templates plus a variant with other prefixes; fails on any unacknowledged finding.
      - run: make synth

  secrets:
    name: Secret scan (canary + full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # scan the full history, not just the last commit
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum pinned)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks && sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Canary (a generated fake key must be detected)
        run: ./scripts/secret_canary.sh
      - name: Full history scan
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact

  dependencies:
    name: Dependency vulnerabilities (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install osv-scanner 2.7.0 (checksum pinned)
        run: |
          curl -sSfL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum -c -
          sudo install /tmp/osv-scanner /usr/local/bin/osv-scanner
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: false
      - run: make init
      # The built agent package's exact versions (generated here; nothing git-ignored is assumed to exist).
      - run: uv run python scripts/agent_freeze.py
      - run: osv-scanner scan source --lockfile uv.lock --lockfile requirements.txt:.build/agent-freeze.txt

  ash:
    # Not run locally (no Docker on the maintainer machine); this job is where ASH runs.
    # A scanner that did not complete counts as a failure, like an actionable finding.
    name: ASH (all scanners must complete)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      UV_VERSION: 0.10.10
      # automated-security-helper v3.7.1 (lightweight tag; commit from git ls-remote)
      ASH_REF: af1206aff596f1288ad066828058b3011de2a998 # pragma: allowlist secret (public git commit hash)
    steps:
      # Same layout as ASH's own GitHub Actions tutorial: run ASH from a checkout of its repository so
      # the image build context contains pyproject.toml (running it from an installed package does not).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: awslabs/automated-security-helper
          ref: ${{ env.ASH_REF }}
          path: ash-src
          persist-credentials: false
      - name: Install uv
        run: python3 -m pip install --user "uv==${UV_VERSION}"
      # ASH's default base image is python:3.12-slim-bookworm on public.ecr.aws. Anonymous pulls from
      # GitHub-hosted runners hit "429 Too Many Requests", and `ash --custom-build-arg` is not passed to
      # the scan-mode image build. So the image is built here from the Docker Hub copy of the same tag,
      # with the build arguments ASH itself uses, and ASH runs it with --no-build.
      - name: Build the ASH image
        run: |
          docker build --target ci --tag automated-security-helper:ci \
            --build-arg "BASE_IMAGE=docker.io/library/python:3.12-slim-bookworm" \
            --build-arg "UID=$(id -u)" --build-arg "GID=$(id -g)" \
            --build-arg INSTALL_ASH_REVISION=LOCAL --build-arg OFFLINE=NO \
            --build-arg OFFLINE_SEMGREP_RULESETS=p/ci \
            --file ash-src/Dockerfile ash-src
      - name: Run ASH in container mode
        env:
          ASH_IMAGE_NAME: automated-security-helper:ci
        run: |
          "${HOME}/.local/bin/uv" run --directory ash-src ash --mode container --no-build --build-target ci \
            --source-dir "${GITHUB_WORKSPACE}/repo" --output-dir "${RUNNER_TEMP}/ash" \
            || echo "ash exited with $?"
      - name: Keep the ASH report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ash-report
          path: ${{ runner.temp }}/ash
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on findings or incomplete scanners
        run: |
          python3 - "${RUNNER_TEMP}/ash/ash_aggregated_results.json" <<'PY'
          import json, sys
          stats = json.load(open(sys.argv[1]))["metadata"]["summary_stats"]
          print(json.dumps(stats, indent=2))
          bad = {k: stats.get(k, 0) for k in ("actionable", "failed", "missing")}
          if any(bad.values()):
              sys.exit(f"ASH did not pass: {bad}")
          PY
