# Weekly, grouped, never auto-merged. A 7-day cooldown gives new releases a week before a PR is opened.
# Dependency updates must pass the evaluation set and, for the agent package, a deployment check
# (deploy-verify workflow) before merging.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      cdk: {patterns: ["aws-cdk-lib", "constructs", "cdk-nag"]}
      agent: {patterns: ["strands-agents", "bedrock-agentcore", "mcp", "pydantic"]}
      dev: {patterns: ["pytest", "ruff", "boto3", "redis", "requests", "awsiotsdk"]}
    commit-message: {prefix: "chore(deps)"}
    open-pull-requests-limit: 5
    ignore:
      # mcp stays on the fixed 1.x line (>=1.30.0, GHSA-84m7-p3x7-pcfv) until strands-agents accepts
      # mcp>=2.2; strands-agents 1.61.1 declares mcp<2.2 (DECISIONS.md D29).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /src/agent
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      agent: {patterns: ["*"]}
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    cooldown: {default-days: 7}
    groups:
      actions: {patterns: ["*"]}
    commit-message: {prefix: "chore(ci)"}
