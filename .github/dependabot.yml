version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
    commit-message: {prefix: "chore(deps)"}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /src/agent
    schedule: {interval: weekly}
    groups:
      agent: {patterns: ["*"]}
    commit-message: {prefix: "chore(deps)"}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: "chore(ci)"}
# Pull requests are never auto-merged: dependency updates must pass the evaluation set and, for the agent
# image, a deployment test before merging.
