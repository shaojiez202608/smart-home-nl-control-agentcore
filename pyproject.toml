[project]
name = "smart-home-nl-agent"
version = "0.1.0"
description = "Natural-language smart home control on Amazon Bedrock AgentCore and Amazon Nova (prototype)"
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "boto3>=1.43",
  "redis>=5.2",
  "requests>=2.32",
  "awsiotsdk>=1.22",
]
infra = [
  "aws-cdk-lib>=2.273.0",
  "constructs>=10.4",
  "cdk-nag>=3.0",
]
agent = [
  "strands-agents>=1.61",
  "bedrock-agentcore>=1.24",
  "pydantic>=2.8",
  # GHSA-84m7-p3x7-pcfv (High) is fixed in mcp 1.30.0 (1.x) and 2.2.0 (2.x). strands-agents 1.61.1 requires
  # mcp<2.2, so the fixed 1.x line is the only fixed version inside its declared range.
  "mcp>=1.30.0,<2.0",
]

[tool.uv]
package = false
default-groups = ["dev", "infra", "agent"]

[tool.pytest.ini_options]
pythonpath = ["src/core", "src/aws", "src/agent", "src/functions", ".", "scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["cdk.out", ".build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"local/**" = ["S311"]
"scripts/**" = ["S311", "S603", "S607"]
# IoT rule SQL strings and CDK property names containing "secret" are not SQL/credentials.
"infra/**" = ["S106", "S608"]
